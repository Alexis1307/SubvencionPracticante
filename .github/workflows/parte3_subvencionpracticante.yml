# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy WAR app to Azure Web App - SubvencionPracticante

on:
  push:
    branches:
      - parte3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/subvencion-app.war

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CBCBF1EEE9664D8AA21F00668B2696F5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F049B4C3F435460CA2844E9255F0D2C5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9E9DBE07D8BB4D149D7A63FDAF9E8C53 }}

      - name: Deploy WAR to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SubvencionPracticante'
          slot-name: 'Production'
          package: subvencion-app.war


          
